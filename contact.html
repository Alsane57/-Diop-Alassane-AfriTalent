<!DOCTYPE html>
<html lang="fr">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>AfriTalent | La plateforme des freelances tech en Afrique</title> 
    <!-- Bootstrap 5 via CDN : feuille de style --> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <!-- Votre feuille de style personnelle --> 
    <link rel="stylesheet" href="css/style.css">

</head>

<body> 
    <!-- Le contenu de la page sera ajoute ici --> 

    <!-- Navigation Bootstrap commune a toutes les pages --> 
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark"> 
        <div class="container"> 
            <a class="navbar-brand" href="index.html">AfriTalent</a> 
            <button class="navbar-toggler" type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navMenu" 
                aria-controls="navMenu" 
                aria-expanded="false" 
                aria-label="Toggle navigation"> 
                <span class="navbar-toggler-icon"></span> 
            </button> 
            <div class="collapse navbar-collapse" id="navMenu"> 
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li> 
                    <li class="nav-item"><a class="nav-link" href="freelances.html">Freelances</a></li> 
                    <li class="nav-item"><a class="nav-link" href="tarifs.html">Tarifs</a></li> 
                    <li class="nav-item"><a class="nav-link" href="about.html">A propos</a></li> 
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li> 
                </ul> 
            </div> 
        </div> 
    </nav> 
    <main>
        <section class="contact-section">
            <h1>Contactez-nous</h1>
            <p>N'hésitez pas à nous contacter pour toute question ou demande d'information.</p>
            <form>
                <div >
                    <div class="mb-3">
                        <label for="name" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="name" placeholder="Votre nom">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Votre email">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Téléphone</label>
                        <input type="tel" class="form-control" id="phone" placeholder="Votre téléphone">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" rows="5" placeholder="Votre message"></textarea>
                    <a class="btn btn-primary" href="#contact">SEND MESSAGE</a>
                </div>
                
            </form>
        </section> 
    </main>
    <!-- footer -->
    <footer> 
        <div class="container py-4"> 
            <p>&copy; 2025 AfriTalent. Tous droits reserves.</p> 
        </div> 
    </footer>
    <!-- Bootstrap 5 via CDN : script JavaScript -->
